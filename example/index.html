<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Client Probe</title>
    <style>
      body {
        background: #121418;
        color: #e6e6e6;
        font-family: ui-monospace, monospace;
        padding: 2rem;
      }

      h1 {
        font-size: 1.2rem;
      }

      #result {
        white-space: pre;
      }

      #progress {
        color: #888;
      }

      .open {
        color: #6fdc8c;
      }

      .open-silent {
        color: #e5c07b;
      }

      .closed {
        color: #5c6370;
      }

      .restricted {
        color: #c678dd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The Client Probe</h1>
      <div id="progress">starting…</div>
      <div id="result"></div>
    </main>

    <script type="module">
      import * as theClientProbe from "../src/index.js";

      const host = "127.0.0.1";
      const progress = document.querySelector("#progress");
      const result = document.querySelector("#result");

      const renderRow = ({ port, state, durationMs }) => {
        const target = `${host}:${port}`.padEnd(20);
        const ms = `${Math.round(durationMs)} ms`;
        return `<div class="${state}">${target} ${state.padEnd(11)} ${ms}</div>`;
      };

      await theClientProbe.scanPorts(host, 1, 65535, {
        fetchTimeoutMs: 500,
        onProgress({ completed, total, result: probeResult }) {
          progress.textContent = `scanned ${completed} / ${total} ports`;
          if (probeResult.state !== "closed") {
            result.insertAdjacentHTML("beforeend", renderRow(probeResult));
          }
        },
      });

      progress.textContent = "done";
    </script>
  </body>
</html>
